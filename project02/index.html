<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header id="main-header" class="text-white p-4 mb-3">
      <div class="row">
        <div class="col-md-12">
          <h1 id="header-title">TO-DO LIST</h1>
          <h2 id="header-description">by Ben Spano</h2>
        </div>
      </div>
    </header>

    <form id="taskForm">
      <div class="card">
        <div class="card-body">
          <div class="input-group mb-3">
            <input type="text" class="form-control"
                   id="inputField" placeholder="Enter a task">

            <select class="form-select" id="prioritySelect"
                    style="max-width: 12rem;  margin-left:8px">
              <option value="low">Low Priority</option>
              <option value="medium" selected>Medium Priority</option>
              <option value="high">High Priority</option>
            </select>

            <div class="form-check form-check-inline ms-2">
              <input class="form-check-input" type="radio" name="statusRadio"
                     id="statusPending" value="pending" checked>
              <label class="form-check-label" for="statusPending">Pending</label>
            </div>

            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio"  name="statusRadio"
                     id="statusCompleted" value="completed">
              <label class="form-check-label" for="statusCompleted">Completed</label>
            </div>

            <button type="submit" class="btn btn-primary ms-2" id="addToDo">Add</button>
          </div>

          <ul class="to-dos list-unstyled" id="toDoContainer"></ul>
        </div>
      </div>
    </form>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="main.js"></script>
</body>
</html>
